<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muonica API Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            950: '#0a0a0b',
                            900: '#111113',
                            850: '#17171a',
                            800: '#1c1c20',
                            700: '#26262b',
                            600: '#333338',
                            500: '#4a4a52',
                            400: '#6b6b74',
                            300: '#8f8f98',
                            200: '#b4b4bc',
                        },
                        brand: '#e8543f',
                        mint: '#3ddc97',
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        ::selection { background: #e8543f; color: white; }
        .endpoint-link { transition: color .15s ease, background-color .15s ease; }
        .code-line:hover { background-color: rgba(255,255,255,0.02); }
        .copy-code { transition: background-color .15s ease, color .15s ease; }
        .doc-nav::-webkit-scrollbar { width: 6px; }
        .doc-nav::-webkit-scrollbar-thumb { background: #26262b; border-radius: 999px; }
        .code-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .code-scrollbar::-webkit-scrollbar-thumb { background: #333338; border-radius: 999px; }
    </style>
</head>
<body class="bg-ink-950 text-ink-200 antialiased">
<div id="app" class="min-h-screen"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
